; PixelBlue firmware - one firmware for all Bluetooth ESP32 boards.
; Strip type, pins and matrix size are set from the Android app (no recompiling).
;
; Build:   pio run -e esp32        (or esp32c3 / esp32s3)
; Flash:   pio run -e esp32 -t upload

[platformio]
default_envs = esp32, esp32c3, esp32s3

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit DotStar @ ^1.2.5
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CORE_DEBUG_LEVEL=0

[env:esp32]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
